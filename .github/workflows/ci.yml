name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Format check (ruff)
        run: ruff format --check src tests scripts
      - name: Tests
        run: pytest --cov=sentinelguard --cov-report=term-missing -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sentinelguard-ai:ci .
      - name: Smoke test container
        run: |
          docker run -d --name sg -p 8000:8000 sentinelguard-ai:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break || sleep 1
          done
          curl -fsS http://localhost:8000/ready
          curl -fsS -F "files=@samples/terraform/vulnerable.tf" http://localhost:8000/api/v1/scans | grep -q '"risk_level":"critical"'
          docker rm -f sg
